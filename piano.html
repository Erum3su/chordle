<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>弹钢琴 · Chordle</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#9e2236">
<meta name="description" content="自由弹钢琴：鼠标、触屏、电脑键盘或 MIDI 键盘都能弹，可开关延音。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="/vendor/tonal.min.js" defer></script>
<style>
/* Same tokens as the main Chordle page so the pages read as one site */
:root{
  --bg:#eceef2; --panel:#f8f9fb; --fg:#1b1e26; --muted:#646a78; --line:#d4d8e0;
  --accent:#9e2236; --accent-fg:#ffffff; --sel:#2f6bd8;
  --ivory:#fbfaf6; --ivory-edge:#c9c6bc; --ebony:#16171b; --ebony-hi:#3a3c44;
  --display:"Noto Serif SC","Songti SC",Georgia,serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121419; --panel:#1b1e25; --fg:#e8eaef; --muted:#9aa0ad; --line:#2d313b;
  --accent:#e05a70; --accent-fg:#1a0b0f; --sel:#5b93f0;
  --ivory:#ece9e0; --ivory-edge:#8f8b80; --ebony:#0a0a0c; --ebony-hi:#34363d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121419; --panel:#1b1e25; --fg:#e8eaef; --muted:#9aa0ad; --line:#2d313b;
  --accent:#e05a70; --accent-fg:#1a0b0f; --sel:#5b93f0;
  --ivory:#ece9e0; --ivory-edge:#8f8b80; --ebony:#0a0a0c; --ebony-hi:#34363d;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:2rem;margin:0;letter-spacing:.01em;line-height:1.1}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.12em;margin-top:4px}
.hbtns{display:flex;gap:8px;align-items:center}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:5px 12px;font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;text-decoration:none}
.hbtn:hover{border-color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.ctl{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.grp{display:flex;gap:8px;align-items:center}
.label{font-size:.75rem;letter-spacing:.12em;color:var(--muted)}
select{font:inherit;font-size:.9rem;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 14px;font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn kbd{font-family:var(--mono);font-size:.7rem;opacity:.6}
.btn.sq{width:32px;height:32px;padding:0;justify-content:center}
.btn.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.tog.pedal{box-shadow:0 0 0 2px var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.range{font-family:var(--mono);font-size:.85rem;min-width:5.6em;text-align:center}
input[type=range]{accent-color:var(--accent);width:110px}
.toggles label{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}
.toggles input{accent-color:var(--accent)}
.note{font-size:.8rem;color:var(--muted)}
/* what is sounding */
.now{display:flex;align-items:baseline;gap:14px;min-height:2.6rem;flex-wrap:wrap;justify-content:center}
.now .cn{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1.2}
.now .ns{font-family:var(--mono);color:var(--muted);font-size:.95rem}
.now.old{opacity:.4}
/* keyboard */
.kbrow{display:flex;align-items:stretch;gap:6px}
.kbrow .btn.sq{height:auto;width:28px;flex:none}
@media (max-width:600px){.kbrow{gap:4px}.kbrow .btn.sq{width:22px;font-size:.7rem}}
.kbbox{flex:1;min-width:0}
.kb{position:relative;height:calc(var(--kw) * 4.6);max-height:300px;min-height:150px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  border-top:6px solid var(--accent);border-radius:4px 4px 0 0;background:var(--ebony)}
.kb .k{position:absolute;top:0;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-family:var(--mono);line-height:1}
.kb .w{height:100%;background:var(--ivory);border:1px solid var(--ivory-edge);border-top:0;border-radius:0 0 5px 5px;padding-bottom:7px;color:#77736a}
.kb .b{height:62%;background:linear-gradient(var(--ebony-hi),var(--ebony) 18%);border-radius:0 0 4px 4px;z-index:2;padding-bottom:6px;color:#e6e8ec;box-shadow:inset 0 -3px 0 #000}
.kb .k span{pointer-events:none;font-weight:700}
.kb .kc{font-size:clamp(9px,calc(var(--kw) * .36),14px);opacity:.75;margin-bottom:5px;text-align:center;line-height:1.25}
.kb .w .kc{color:#4f4c45}
.kb .nn{font-size:clamp(9px,calc(var(--kw) * .36),13px);opacity:.7}
.kb .w.on{background:color-mix(in srgb,var(--sel) 45%,var(--ivory));color:#0d2552}
.kb .b.on{background:var(--sel);box-shadow:none}
.kb .k.ring:not(.on){box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--accent) 70%,transparent)}
.kb .w.mapped{background:linear-gradient(var(--ivory) 70%,color-mix(in srgb,var(--sel) 10%,var(--ivory)))}
.kb .w.mapped.on{background:color-mix(in srgb,var(--sel) 45%,var(--ivory))}
.kb.nolab .kc{display:none}
.kb.nonames .nn:not(.c){display:none}
/* black-key names sit at the top of the key, clear of the key labels at the bottom */
.kb .b{justify-content:space-between;padding-top:7px}
.kb .nb{font-size:clamp(8px,calc(var(--kw) * .3),12px);opacity:.75;letter-spacing:-.04em;white-space:nowrap}
.load{font-size:.8rem;color:var(--muted)}
.ctl input[type=number]{width:4.2em;font:inherit;font-family:var(--mono);font-size:.95rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:center}
.beats{display:flex;gap:7px;align-items:center}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:background .05s}
.beats i.on{background:var(--fg)}
.beats i.on.one{background:var(--accent)}
.looper{flex-basis:100%;flex-wrap:wrap}
.looper .btn{white-space:nowrap}
.looper select{max-width:100%}
#recBtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#recBtn.arm{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{box-shadow:0 0 0 2px var(--accent)}}
.arp{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.arpch{display:flex;flex-wrap:wrap;gap:6px}
.arpch button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:4px 10px;font:inherit;font-family:var(--display);font-weight:600;font-size:.95rem;cursor:pointer}
.arpch button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
/* chord-tone markers for the arpeggio practice: 1 red, 3 amber, 5 green, 7 blue */
.kb .dg{position:absolute;left:50%;transform:translateX(-50%);min-width:clamp(14px,calc(var(--kw) * .7),22px);height:clamp(14px,calc(var(--kw) * .7),22px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:clamp(8px,calc(var(--kw) * .36),12px);color:#fff;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.kb .w .dg{top:66%}
.kb .b .dg{top:34%}
.kb .dg.d1{background:#c8283f} .kb .dg.d3{background:#d08a00} .kb .dg.d5{background:#2f9a52} .kb .dg.d7{background:#2f6bd8}
footer{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.7}
footer kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
@media (hover:none),(pointer:coarse){.kb .kc{display:none}.keyhelp{display:none}}
@media (max-width:480px){h1{font-size:1.6rem}.panel{padding:10px 12px}.ctl{gap:8px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span data-t="title"></span><small data-t="sub"></small></h1>
    <div class="hbtns">
      <button type="button" class="hbtn" id="langBtn"></button>
      <a class="hbtn" href="/" data-t="back"></a>
    </div>
  </header>

  <section class="panel ctl" aria-label="settings">
    <div class="grp">
      <span class="label" data-t="inst"></span>
      <select id="instSel" aria-label="instrument"></select>
      <span class="load" id="load"></span>
    </div>
    <div class="grp">
      <button type="button" class="btn tog" id="susBtn" aria-pressed="false"><span id="susLab"></span><kbd class="keyhelp" data-t="susKey"></kbd></button>
      <input type="range" id="susLen" min="0.3" max="4" step="0.1" aria-label="sustain length">
      <span class="note" id="susVal"></span>
    </div>
    <div class="grp keyhelp">
      <span class="label" data-t="kbRange"></span>
      <button type="button" class="btn sq" id="octDown" aria-label="-">−</button>
      <span class="range" id="rangeLab"></span>
      <button type="button" class="btn sq" id="octUp" aria-label="+">+</button>
    </div>
    <div class="grp">
      <span class="label" data-t="key"></span>
      <select id="keySel" aria-label="key"></select>
      <button type="button" class="btn sq" id="trDown" aria-label="-1">♭</button>
      <span class="range" id="trLab"></span>
      <button type="button" class="btn sq" id="trUp" aria-label="+1">♯</button>
    </div>
    <div class="grp">
      <span class="label" data-t="vol"></span>
      <input type="range" id="vol" min="0" max="100" step="1" aria-label="volume">
    </div>
    <div class="grp toggles">
      <label class="keyhelp"><input type="checkbox" id="optLab"> <span data-t="showKeys"></span></label>
      <label><input type="checkbox" id="optNames"> <span data-t="showNames"></span></label>
      <label><input type="checkbox" id="optSmart"> <span data-t="smart"></span></label>
      <span class="grp"><span class="label" data-t="dyn"></span><input type="range" id="dyn" min="0.5" max="3" step="0.1" aria-label="dynamics"></span>
    </div>
    <div class="grp">
      <button type="button" class="btn" id="midiBtn"><span data-t="midi"></span></button>
      <span class="note" id="midiNote"></span>
    </div>
  </section>

  <section class="panel ctl" aria-label="rhythm">
    <div class="grp">
      <button type="button" class="btn tog" id="drumBtn" aria-pressed="false"><span data-t="drums"></span><kbd class="keyhelp">⏎</kbd></button>
      <select id="patSel" aria-label="pattern"></select>
    </div>
    <div class="grp">
      <button type="button" class="btn tog" id="metroBtn" aria-pressed="false"><span data-t="metro"></span></button>
      <select id="sigSel" aria-label="time signature"><option>2/4</option><option>3/4</option><option>4/4</option><option>6/8</option></select>
    </div>
    <div class="grp">
      <span class="label">BPM</span>
      <button type="button" class="btn sq" id="bpmDown" aria-label="-">−</button>
      <input type="number" id="bpm" min="40" max="240" step="1" inputmode="numeric" aria-label="BPM">
      <button type="button" class="btn sq" id="bpmUp" aria-label="+">+</button>
      <input type="range" id="bpmRange" min="40" max="240" step="1" aria-label="BPM">
    </div>
    <div class="grp">
      <span class="label" data-t="dvol"></span><input type="range" id="dvol" min="0" max="100" step="1" aria-label="drum volume">
      <span class="label" data-t="mvol"></span><input type="range" id="mvol" min="0" max="100" step="1" aria-label="metronome volume">
    </div>
    <div class="beats" id="beats" aria-hidden="true"></div>
    <div class="grp looper">
      <button type="button" class="btn tog" id="recBtn" aria-pressed="false"><span id="recLab"></span><kbd class="keyhelp">L</kbd></button>
      <button type="button" class="btn" id="loopPlay"></button>
      <button type="button" class="btn" id="loopUndo"><span data-t="undo"></span></button>
      <button type="button" class="btn" id="loopClear"><span data-t="clear"></span></button>
      <span class="label" data-t="bars"></span><select id="barsSel" aria-label="bars"></select>
      <span class="label" data-t="quant"></span><select id="quantSel" aria-label="quantize"></select>
      <span class="label" data-t="lvol"></span><input type="range" id="lvol" min="0" max="100" step="1" aria-label="loop volume">
      <span class="note" id="loopNote"></span>
    </div>
  </section>

  <section class="panel">
    <div class="arp" hidden>
      <button type="button" class="btn tog" id="arpBtn" aria-pressed="false"><span data-t="arp"></span></button>
      <div class="arpch" id="arpCh"></div>
      <span class="note" id="arpNote"></span>
    </div>
    <div class="now" id="now" aria-live="polite"><span class="cn" id="chordName"></span><span class="ns" id="noteNames"></span></div>
    <div class="kbrow">
      <button type="button" class="btn sq" id="viewDown" aria-label="◀">◀</button>
      <div class="kbbox"><div class="kb" id="kb"></div></div>
      <button type="button" class="btn sq" id="viewUp" aria-label="▶">▶</button>
    </div>
  </section>

  <footer><span class="keyhelp"><span data-t="help1"></span><br><span data-t="help2"></span><br></span><span data-t="credit"></span></footer>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
let LANG = (() => { try{ const v = localStorage.getItem('chordle:lang'); if(v === 'zh' || v === 'en') return v; }catch(e){} return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'; })();
const L = (zh, en) => LANG === 'en' ? en : zh;

const T = {
  title: ['弹钢琴', 'Free play'],
  sub: ['鼠标、触屏、电脑键盘或 MIDI 键盘都能弹', 'Play with mouse, touch, computer keys or a MIDI keyboard'],
  back: ['← 猜和弦', '← Chordle'],
  inst: ['乐器', 'Sound'],
  susKey: ['空格', 'Space'],
  kbRange: ['键盘音域', 'Key range'],
  vol: ['音量', 'Volume'],
  showKeys: ['琴键上显示按键', 'Key labels'],
  showNames: ['显示音名', 'Note names'],
  smart: ['智能力度', 'Smart velocity'],
  drums: ['鼓机', 'Drums'],
  metro: ['节拍器', 'Metronome'],
  dvol: ['鼓', 'Drums'],
  mvol: ['节拍器', 'Click'],
  undo: ['撤销一层', 'Undo layer'],
  clear: ['清空', 'Clear'],
  bars: ['长度', 'Length'],
  quant: ['自动对齐', 'Snap'],
  lvol: ['循环', 'Loop'],
  dyn: ['动态幅度', 'Dynamics'],
  arp: ['秋叶 A 段琶音', 'Autumn Leaves A: arpeggios'],
  key: ['调', 'Key'],
  midi: ['连接 MIDI 键盘', 'Connect MIDI'],
  help1: ['电脑键盘：下排 Z X C V … / 是白键（Z 是低音 7），A 行 D F H J K ; \' 是黑键；上排 Q W E R … \\ 是白键，数字行是黑键。上排 Q 从高一个八度的 7 开始，指法和下排一样，两排有几个音重叠，加起来不用换八度能弹将近三个八度。', 'Computer keys: bottom row Z X C V … / are white keys (Z is the B below C) with the A row (D F H J K ; \') as black keys; the top row Q W E R … \\ are white keys with the number row as black keys. Q starts on the B an octave above Z with the same shape, so the rows overlap a little and together cover nearly three octaves.'],
  help2: ['按住空格 = 踩延音踏板（延音开着时按住空格是暂时松开踏板，清掉余音），旁边的滑块调余音长短· ← → 整体移八度 · ↑ ↓ 升降半音（移调，琴键位置不变，只改变发出的音高）· Enter 开关鼓机 · L 循环录音（录第一遍 → 播放 → 叠录）· Esc 停掉所有声音', 'Hold Space = sustain pedal (with sustain on, holding Space lifts the pedal to clear the ring); the slider sets how long notes ring · ← → shift by an octave · ↑ ↓ transpose a semitone (keys stay put, only the pitch moves) · Enter starts or stops the drums · L loop record (first take → play → overdub) · Esc stops all sound'],
  credit: ['乐器采样：tonejs-instruments（MIT）· 音乐会大钢琴：Salamander Grand Piano，Alexander Holm（CC BY 3.0）· 摇滚风琴、爵士风琴、Rhodes 电钢琴、鼓机和节拍器：FluidR3 GM，Frank Wen（CC BY 3.0，经 midi-js-soundfonts 和 webaudiofontdata）', 'Instrument samples: tonejs-instruments (MIT) · Concert grand: Salamander Grand Piano, Alexander Holm (CC BY 3.0) · Rock organ, jazz organ, Rhodes, drums and metronome: FluidR3 GM, Frank Wen (CC BY 3.0, via midi-js-soundfonts and webaudiofontdata)'],
};

const store = {
  get(k, d){ try{ const v = localStorage.getItem('chordle:' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('chordle:' + k, JSON.stringify(v)); }catch(e){} }
};

// ---------- instruments ----------
// The same sounds as the main page: sample sets from /samples/<id>/<midi>.mp3, electric piano and synth built from oscillators.
// rel is how fast a note dies when the key comes up
const INSTRUMENTS = [
  {id:'piano',   name:'钢琴', en:'Piano', rel:0.09, notes:[36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84]},
  {id:'grand',   name:'音乐会大钢琴', en:'Concert grand', rel:0.09, notes:[30, 33, 36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84, 87, 90]},
  {id:'rhodes',  name:'Rhodes 电钢琴', en:'Rhodes', rel:0.12, gain:5, tail:true, notes:[33, 36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84, 87, 90, 93, 96]},
  {id:'epiano',  name:'电钢琴', en:'Electric piano', rel:0.12, synth:epianoNote},
  {id:'guitar',  name:'原声吉他', en:'Acoustic guitar', rel:0.12, notes:[38, 41, 44, 47, 50, 53, 56, 59, 62, 65, 68, 71, 74]},
  {id:'nylon',   name:'尼龙吉他', en:'Nylon guitar', rel:0.12, notes:[35, 38, 42, 45, 49, 52, 55, 59, 63, 66, 69, 73, 76, 79, 82]},
  {id:'eguitar', name:'电吉他', en:'Electric guitar', rel:0.1, notes:[37, 40, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84]},
  {id:'synth',   name:'合成器', en:'Synth pad', rel:0.25, synth:padNote},
  {id:'rock',    name:'摇滚风琴', en:'Rock organ', rel:0.03, bus:organBus, loop:[0.5, 3.05], flat:true, notes:[36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84, 87, 90, 93, 96]},
  {id:'jazz',    name:'爵士风琴', en:'Jazz organ', rel:0.03, gain:3.8, loop:[1.35, 2.3], flat:true, notes:[36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84, 87, 90, 93, 96]},
  {id:'organ',   name:'风琴', en:'Organ', rel:0.05, gain:0.9, notes:[33, 36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84]},
  {id:'harp',    name:'竖琴', en:'Harp', rel:0.3, notes:[35, 38, 41, 45, 48, 52, 55, 59, 62, 65, 69, 72, 76, 79, 83, 86]},
  {id:'strings', name:'弦乐', en:'Strings', rel:0.18, notes:[36, 39, 43, 46, 49, 52, 55, 60, 64, 67, 72, 76, 79, 84, 88]},
];

// Both synths are the main page's, made to hold while the key is down; they return their oscillators and output node
function epianoNote(a, m, vel, t){
  const f = 440 * Math.pow(2, (m - 69) / 12), out = a.createGain();
  const car = a.createOscillator(), mod = a.createOscillator(), mg = a.createGain();
  car.frequency.value = f; mod.frequency.value = f;
  mg.gain.setValueAtTime(f * 2.2 * vel, t); mg.gain.exponentialRampToValueAtTime(f * 0.25, t + 0.6);
  mod.connect(mg); mg.connect(car.frequency);
  const tine = a.createOscillator(), tg = a.createGain();
  tine.frequency.value = f * 14; tg.gain.setValueAtTime(0.05 * vel, t); tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  tine.connect(tg); tg.connect(out);
  const ag = a.createGain(), decay = Math.max(0.9, 2.4 - (m - 48) / 30);
  ag.gain.setValueAtTime(0, t); ag.gain.linearRampToValueAtTime(0.3 * vel, t + 0.005);
  ag.gain.setTargetAtTime(0.0001, t + 0.01, decay / 2.5);
  const trem = a.createGain(); trem.gain.value = 1;
  const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 4.5; lg.gain.value = 0.03;
  lfo.connect(lg); lg.connect(trem.gain);
  car.connect(ag); ag.connect(trem); trem.connect(out);
  const srcs = [car, mod, tine, lfo];
  srcs.forEach(o => { o.start(t); o.stop(t + decay * 4); });
  return {srcs, out};
}
// Rock organ: FluidR3 GM "Rock Organ" samples through an overdriven preamp the way 70s rock players pushed it: a little mid push, tube-style clipping,
// then a speaker-cabinet roll-off. No Leslie wobble, just the grit.
let organIn = null;
function organBus(a){
  if(organIn) return organIn;
  organIn = a.createGain(); organIn.gain.value = 2.8;
  const mid = a.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 900; mid.Q.value = 0.8; mid.gain.value = 4;
  const ws = a.createWaveShaper(), n = 2048, curve = new Float32Array(n);
  // slightly asymmetric soft clip, like an overdriven valve
  for(let i = 0; i < n; i++){ const x = i / (n - 1) * 2 - 1; curve[i] = x >= 0 ? Math.tanh(x * 2.6) / Math.tanh(2.6) : Math.tanh(x * 2.1) / Math.tanh(2.1); }
  ws.curve = curve; ws.oversample = '4x';
  const post = a.createGain(); post.gain.value = 0.3;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4800; lp.Q.value = 0.7;
  const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 60;
  organIn.connect(mid); mid.connect(ws); ws.connect(post); post.connect(lp); lp.connect(hp); hp.connect(master);
  return organIn;
}
function padNote(a, m, vel, t){
  const f = 440 * Math.pow(2, (m - 69) / 12);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 4;
  lp.frequency.setValueAtTime(f * 1.5, t);
  lp.frequency.linearRampToValueAtTime(Math.min(9000, f * 7), t + 0.08);
  lp.frequency.setTargetAtTime(Math.min(5000, f * 3), t + 0.1, 0.5);
  const out = a.createGain();
  out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.2 * vel, t + 0.03);
  out.gain.setTargetAtTime(0.14 * vel, t + 0.05, 0.4);
  lp.connect(out);
  const srcs = [[-7, 'sawtooth', 1], [7, 'sawtooth', 1], [0, 'square', 0.5]].map(([cents, type, lvl], i) => {
    const o = a.createOscillator(), og = a.createGain();
    o.type = type; o.frequency.value = i === 2 ? f / 2 : f; o.detune.value = cents; og.gain.value = lvl * 0.33;
    o.connect(og); og.connect(lp); o.start(t); o.stop(t + 30);
    return o;
  });
  return {srcs, out};
}

const S = Object.assign({inst:null, sustain:false, vol:80, base:48, labels:true, keyNames:true, transpose:0, susLen:1.5, smart:true, dyn:1.6, arp:false, pat:'rock', bpm:100, sig:'4/4', dvol:70, mvol:70, bars:0, quant:'8', lvol:80}, store.get('piano', {}));
if(!INSTRUMENTS.some(i => i.id === S.inst)){
  const main = (() => { try{ return localStorage.getItem('chordle:inst'); }catch(e){ return null; } })();
  S.inst = INSTRUMENTS.some(i => i.id === main) ? main : 'piano';
}
const save = () => store.set('piano', S);
let inst = INSTRUMENTS.find(i => i.id === S.inst);

// ---------- audio ----------
let ctx, master;
function getCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint:'interactive'});
    const comp = ctx.createDynamicsCompressor();
    // gentle, so it only catches big chords and leaves the touch dynamics alone
    comp.threshold.value = -10; comp.knee.value = 10; comp.ratio.value = 3; comp.attack.value = 0.002;
    master = ctx.createGain();
    master.connect(comp); comp.connect(ctx.destination);
    master.__out = comp;   // drums and metronome join after the piano's volume
    setVol();
  }
  return ctx;
}
function setVol(){ if(master) master.gain.value = 0.7 * Math.pow(S.vol / 80, 1.6); }
// browsers only let audio start from a user gesture
function unlock(){ const a = getCtx(); if(a.state !== 'running') a.resume(); }

const bufs = {}, loads = {};
function loadInst(i){
  if(!i.notes) return Promise.resolve();
  if(loads[i.id]) return loads[i.id];
  const a = getCtx(), b = bufs[i.id] = {};
  return loads[i.id] = Promise.all(i.notes.map(m => fetch(`/samples/${i.id}/${m}.mp3`)
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(ab => new Promise(res => a.decodeAudioData(ab, d => { b[m] = d; res(); }, () => res())))
    .catch(() => {})));
}
function setInst(id){
  inst = INSTRUMENTS.find(i => i.id === id) || INSTRUMENTS[0];
  S.inst = inst.id; save();
  $('instSel').value = inst.id;
  if(inst.notes && Object.keys(bufs[inst.id] || {}).length < inst.notes.length) $('load').textContent = L('加载中…', 'Loading…');
  loadInst(inst).then(() => { if(inst.id === id) $('load').textContent = ''; });
}

const voices = new Map();   // midi -> sounding voice
// loop points snapped to rising zero crossings so the seam does not click
function loopPoints(buf, [a, z]){
  if(buf._lp) return buf._lp;
  const d = buf.getChannelData(0), sr = buf.sampleRate;
  const snap = t => { let i = Math.min(d.length - 2, Math.round(t * sr)); for(let k = 0; k < 2000 && i > 1; k++, i--) if(d[i - 1] < 0 && d[i] >= 0) break; return i / sr; };
  return buf._lp = [snap(a), snap(Math.min(z, buf.duration - 0.02))];
}
// how fast a sample is dying away (time constant, s), from its loudness at 0.8 s and 2.3 s
function decayOf(buf){
  if(buf._tau) return buf._tau;
  const d = buf.getChannelData(0), sr = buf.sampleRate;
  const rms = t => { let s = 0; const a = Math.round(t * sr), n = Math.round(0.4 * sr); for(let i = a; i < a + n && i < d.length; i++) s += d[i] * d[i]; return Math.sqrt(s / n) + 1e-6; };
  const r = rms(0.8) / rms(2.3);
  return buf._tau = Math.max(0.3, Math.min(12, r > 1 ? 1.5 / Math.log(r) : 12));
}
function noteOn(key, vel){
  const a = getCtx();
  if(a.state !== 'running') a.resume();
  const old = voices.get(key);
  if(old) release(old, 0.03);
  // transposing changes only the pitch that sounds; the keys stay put
  const v = voice(key + S.transpose, vel, a.currentTime, inst, 1);
  if(!v) return;
  v.srcs[0].onended = () => { if(voices.get(key) === v){ voices.delete(key); paintKey(key); } try{ v.g.disconnect(); }catch(e){} };
  voices.set(key, v);
}
// one sounding note of instrument i at pitch m, starting at time `when`
function voice(m, vel, when, i, gain){
  const a = ctx, g = a.createGain();
  let srcs;
  if(i.synth){
    const n = i.synth(a, m, vel, when);
    srcs = n.srcs;
    n.out.connect(g);
  }else{
    // until the chosen set has decoded, any loaded set stands in so the first notes are not silent
    let b = bufs[i.id];
    if(!b || !Object.keys(b).length){
      i = INSTRUMENTS.find(x => bufs[x.id] && Object.keys(bufs[x.id]).length);
      if(!i) return null;
      b = bufs[i.id];
    }
    let s = null;
    for(const k in b){ if(s == null || Math.abs(k - m) < Math.abs(s - m)) s = +k; }
    const src = a.createBufferSource();
    src.buffer = b[s];
    src.playbackRate.value = Math.pow(2, (m - s) / 12);
    // organ samples are short, so their steady middle loops for as long as the key is held
    if(i.loop){
      const lp = loopPoints(b[s], i.loop);
      src.loop = true; src.loopStart = lp[0]; src.loopEnd = lp[1];
    }
    if(i.flat) vel = 0.8;   // an organ has no touch sensitivity
    // a softer touch also sounds darker, as on a real piano
    const lp = a.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 0.5; lp.frequency.value = 500 + 16000 * Math.pow(vel, 2.5);
    src.connect(lp);
    if(i.tail){
      // these samples stop after 3 s while low notes are still ringing: loop the last stretch
      // and keep it dying away at the rate the recording was decaying
      const [ls, le] = loopPoints(b[s], [2.6, 3.05]), tail = decayOf(b[s]), rate = src.playbackRate.value;
      src.loop = true; src.loopStart = ls; src.loopEnd = le;
      const dg = a.createGain(), t1 = when + ls / rate;
      dg.gain.setValueAtTime(1, t1); dg.gain.setTargetAtTime(0, t1, tail / rate);
      lp.connect(dg); dg.connect(g);
      lp.stopAt = t1 + tail / rate * 7;
    }else lp.connect(g);
    src.start(when);
    if(lp.stopAt) src.stop(lp.stopAt);
    srcs = [src];
  }
  // loudness grows steeply with velocity, like a real piano (about 25 dB from softest to hardest); the synths shape their own level from vel
  const lvl = (i.synth ? 0.9 : 0.78 * Math.pow(vel, 1.8)) * (i.gain || 1) * gain;
  g.gain.value = lvl;
  g.connect(i.bus ? i.bus(a) : master);

}
function release(v, tau, t = ctx.currentTime){
  if(v.done) return;
  v.done = true;
  const f = v.fade;
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(f ? v.lvl * Math.exp(-Math.max(0, t - f.t0) / f.tau) : v.lvl, t);
  v.g.gain.setTargetAtTime(0, t, tau);
  v.stop(t + tau * 8);
}
// a key let go under the pedal keeps ringing, but dies away over about the chosen sustain length
function fadeOut(m){
  const v = voices.get(m);
  if(!v || v.done || v.fade) return;
  fade(v, ctx.currentTime);
}
function fade(v, t){
  const tau = S.susLen / 4;
  v.fade = {t0:t, tau};
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(v.lvl, t);
  v.g.gain.setTargetAtTime(0, t, tau);
  v.stop(t + tau * 7);
}
function damp(m){
  const v = voices.get(m);
  if(!v) return;
  release(v, v.rel);
  voices.delete(m);
}

// ---------- notes held by fingers / keys, and the pedal ----------
const held = new Map();   // midi -> set of whatever is holding it (pointer, computer key, MIDI)
let spaceDown = false, midiPedal = false;
const pedalDown = () => (S.sustain !== spaceDown) || midiPedal;
// Smart velocity for computer keys and the screen, which cannot sense how hard a key is hit:
// phrases start moderate after a pause, a rising line builds and a falling one relaxes, fast runs stay even,
// the top note of what is held sings over the notes under it, extremes of the range are eased, plus a little human wobble.
const SV = {t:-1e9, m:null, level:0.6, recent:[]};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function smartVel(m, hint){
  const now = performance.now(), dt = now - SV.t;
  SV.recent = SV.recent.filter(r => now - r.t < 45);
  const chord = SV.recent.length;   // notes struck together with this one
  if(dt > 700) SV.level = dt > 2000 ? 0.5 : 0.58;   // a long rest starts the next phrase softer
  else if(!chord && SV.m != null){
    SV.level += clamp(m - SV.m, -7, 7) * 0.016;
    if(dt < 110) SV.level += (0.6 - SV.level) * 0.12;
    else if(dt > 450) SV.level += 0.04;   // a held, spaced-out note gets leaned into
  }
  SV.level = clamp(SV.level, 0.32, 0.85);
  let v = SV.level;
  // notes held from before: a note above them sings, one under them accompanies
  const older = [...held.keys()].filter(k => !SV.recent.some(r => r.m === k));
  const top = older.length ? Math.max(...older) : -1;
  if(top >= 0) v += m > top ? 0.1 : -0.14;
  // within a chord struck together, only its top note is brought out, whatever order the keys landed in
  const ctop = SV.recent.reduce((a, r) => r.m > a.m ? r : a, {m:-1});
  if(chord && m > ctop.m){
    const ov = voices.get(ctop.m);
    if(ov && !ov.done && !ov.fade){ ov.lvl *= 0.7; ov.g.gain.value = ov.lvl; }
  }else if(chord) v -= 0.12;
  v -= 0.03 * Math.min(chord, 4);
  if(m < 45) v -= 0.06; else if(m > 88) v -= 0.05;
  v += (hint - 0.7) * 0.5;   // on screen, where the key is touched still counts
  v += (Math.random() - 0.5) * 0.08;
  v = 0.6 + (v - 0.6) * S.dyn;   // the dynamics slider widens or narrows everything around the middle
  SV.recent.push({t:now, m});
  SV.m = Math.max(m, ...SV.recent.map(r => r.m));   // a chord's top note carries the line
  SV.t = now;
  return clamp(v, 0.12, 1);
}
function press(m, who, vel, smart){
  if(m < 21 || m > 108) return;
  if(smart && S.smart) vel = smartVel(m, vel);
  let h = held.get(m);
  if(!h) held.set(m, h = new Set());
  h.add(who);
  noteOn(m, vel);
  recOn(m, vel);
  paintKey(m); showNow();
  arpRoot(m);
}
function lift(m, who){
  const h = held.get(m);
  if(!h || !h.delete(who)) return;
  if(h.size) return;
  held.delete(m);
  recOff(m, pedalDown());
  if(!pedalDown()) damp(m); else fadeOut(m);
  paintKey(m); showNow();
}
function pedalChanged(){
  if(!pedalDown()) [...voices.keys()].forEach(m => { if(!held.has(m)){ damp(m); paintKey(m); } });
  const b = $('susBtn');
  b.setAttribute('aria-pressed', S.sustain ? 'true' : 'false');
  b.classList.toggle('pedal', pedalDown());
  $('susLab').textContent = S.sustain ? L('延音：开', 'Sustain: on') : L('延音：关', 'Sustain: off');
}
function allOff(){
  held.clear();
  [...voices.keys()].forEach(damp);
  ptr.clear();
  renderKb(); showNow();
}

// ---------- computer keyboard ----------
// Two rows so the keys reach nearly three octaves without switching.
// The bottom row Z…/ starts on the B below the base C (so the low 7 is under Z), black keys on the A row;
// the top row Q…\ starts on the next B up with the same shape, black keys on the number row, so the rows overlap by a few notes.
const LOWER = ['KeyZ','KeyX','KeyD','KeyC','KeyF','KeyV','KeyB','KeyH','KeyN','KeyJ','KeyM','KeyK','Comma','Period','Semicolon','Slash','Quote'];
const UPPER = ['KeyQ','KeyW','Digit3','KeyE','Digit4','KeyR','KeyT','Digit6','KeyY','Digit7','KeyU','Digit8','KeyI','KeyO','Digit0','KeyP','Minus','BracketLeft','BracketRight','Backspace','Backslash'];
const KEYMAP = {};
LOWER.forEach((c, i) => KEYMAP[c] = i - 1);
UPPER.forEach((c, i) => KEYMAP[c] = 11 + i);
const KEYLAB = c => ({Comma:',', Period:'.', Slash:'/', Semicolon:';', Quote:"'", Minus:'-', Equal:'=', BracketLeft:'[', BracketRight:']', Backspace:'⌫', Backslash:'\\'})[c] || c.replace(/^Key|^Digit/, '');
const LOW = -1, SPAN = 11 + UPPER.length - 1;   // lowest and highest key, counted from the base C
const BASES = [24, 36, 48, 60, 72];
const keyHeld = new Map();   // key code -> midi it started, so shifting octaves mid-note still lets it go
function shiftBase(d){
  const i = BASES.indexOf(S.base) + d;
  if(i < 0 || i >= BASES.length) return;
  S.base = BASES[i]; save();
  fitView(true); renderKb(); showRange();
}
// Transpose: everything (screen, computer keys, MIDI) keeps its place and only sounds higher or lower,
// so C-major shapes come out in the chosen key.
const KEYS = ['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const FLATKEY = [1, 3, 5, 8, 10];
const tonic = () => ((S.transpose % 12) + 12) % 12;
function setTranspose(t){
  t = Math.max(-12, Math.min(12, t));
  if(t === S.transpose) return;
  S.transpose = t; save();
  showKey(); renderKb(); showNow();
}
function showKey(){
  const t = S.transpose;
  $('keySel').value = tonic();
  $('trLab').textContent = t > 0 ? '+' + t : t < 0 ? '−' + -t : '0';
  $('trDown').disabled = t <= -12;
  $('trUp').disabled = t >= 12;
}
function showRange(){
  $('rangeLab').textContent = nn(S.base + LOW) + '–' + nn(Math.min(108, S.base + SPAN));
  $('octDown').disabled = S.base === BASES[0];
  $('octUp').disabled = S.base === BASES[BASES.length - 1];
}
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(e.code === 'Space'){
    e.preventDefault();
    if(!e.repeat){ unlock(); spaceDown = true; pedalChanged(); }
    return;
  }
  if(e.code === 'ArrowLeft' || e.code === 'ArrowRight'){ e.preventDefault(); shiftBase(e.code === 'ArrowLeft' ? -1 : 1); return; }
  if(e.code === 'ArrowUp' || e.code === 'ArrowDown'){ e.preventDefault(); setTranspose(S.transpose + (e.code === 'ArrowUp' ? 1 : -1)); return; }
  if(e.code === 'Enter' || e.code === 'NumpadEnter'){ e.preventDefault(); if(!e.repeat) toggleDrums(); return; }
  if(e.code === 'Escape'){ allOff(); return; }
  if(e.code === 'KeyL'){ e.preventDefault(); if(!e.repeat) recPress(); return; }
  if(!(e.code in KEYMAP)) return;
  e.preventDefault();
  if(e.repeat || keyHeld.has(e.code)) return;
  const m = S.base + KEYMAP[e.code];
  keyHeld.set(e.code, m);
  press(m, e.code, S.smart ? 0.7 : 0.8, true);
});
document.addEventListener('keyup', e => {
  if(e.code === 'Space'){ spaceDown = false; pedalChanged(); return; }
  if(!keyHeld.has(e.code)) return;
  lift(keyHeld.get(e.code), e.code);
  keyHeld.delete(e.code);
});
// keys held while the window loses focus never send keyup
window.addEventListener('blur', () => {
  keyHeld.forEach((m, c) => lift(m, c)); keyHeld.clear();
  if(spaceDown){ spaceDown = false; pedalChanged(); }
});

// ---------- on-screen keyboard ----------
const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const NAMES_B = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const nn = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
// sounding pitch, spelled with flats in flat keys
// in the Autumn Leaves practice everything is in G minor / B♭, so flats, except D7's F♯
const pcName = m => { const p = (m % 12 + 12) % 12; if(S.arp) return p === 6 && ARP[arpI].name === 'D7' ? 'F♯' : NAMES_B[p]; return (FLATKEY.includes(tonic()) ? NAMES_B : NAMES)[p]; };
const sn = m => (FLATKEY.includes(tonic()) ? NAMES_B : NAMES)[m % 12] + (Math.floor(m / 12) - 1);
const isBlack = m => [1, 3, 6, 8, 10].includes(m % 12);
const kb = $('kb');
let view = {lo:36, nW:36};
// the highest key when nW white keys start at lo
const hiOf = (lo, nW) => { let m = lo, w = 1; while(w < nW){ m++; if(!isBlack(m)) w++; } return m; };
const maxLo = nW => { let lo = 96; while(lo > 24 && hiOf(lo, nW) > 108) lo -= 12; return lo; };
function fitView(follow){
  const w = kb.clientWidth || 800;
  // wide screens: just the stretch the computer keys reach, one white key spare at each end, as big as it fits
  if(w >= 600){
    let lo = S.base + LOW - 1, hi = Math.min(108, S.base + SPAN + 1);
    while(isBlack(lo)) lo--;
    while(isBlack(hi)) hi++;
    let nW = 0;
    for(let m = lo; m <= hi; m++) if(!isBlack(m)) nW++;
    view = {lo, nW};
    return;
  }
  let nW = Math.max(8, Math.min(50, Math.floor(w / (w < 600 ? 26 : 25))));
  if(nW >= 15) nW = Math.floor((nW - 1) / 7) * 7 + 1;   // end on a C when there is room for whole octaves
  let lo = view.lo;
  const span = hiOf(0, nW);
  // keep the computer-key range in view, centred when it does not all fit
  const a = S.base + LOW, z = Math.min(108, S.base + SPAN);
  if(nW !== view.nW || (follow && (a < lo || z > lo + span))) lo = 12 * Math.round(((a + z) / 2 - span / 2) / 12);
  if(nW < 15 && follow) lo = a;   // narrow screens: start where the bottom row starts
  view = {lo:Math.max(24, Math.min(maxLo(nW), lo)), nW};
}
// Autumn Leaves, A section: press any chord's root (by the pitch it sounds) and the keyboard marks that chord's 1 3 5 7 everywhere.
// The seven roots are all different, so a root alone says which chord is meant.
const ARP = [
  {name:'Cm7', root:0, iv:[0, 3, 7, 10]}, {name:'F7', root:5, iv:[0, 4, 7, 10]}, {name:'B♭maj7', root:10, iv:[0, 4, 7, 11]},
  {name:'E♭maj7', root:3, iv:[0, 4, 7, 11]}, {name:'Am7♭5', root:9, iv:[0, 3, 6, 10]}, {name:'D7', root:2, iv:[0, 4, 7, 10]},
  {name:'Gm7', root:7, iv:[0, 3, 7, 10]},
];
let arpI = 0;
// hidden for now (the toggle's row is hidden too); flip to true to bring the practice back
const ARP_ON = false;
if(!ARP_ON) S.arp = false;
function arpRoot(m){
  if(!S.arp) return;
  const i = ARP.findIndex(c => c.root === (m + S.transpose) % 12);
  if(i >= 0 && i !== arpI) setArp(i);
}

function renderKb(){
  const {lo, nW} = view, hi = hiOf(lo, nW);
  const kw = kb.clientWidth / nW;
  kb.style.setProperty('--kw', kw + 'px');
  const inv = {};
  for(const c in KEYMAP) (inv[S.base + KEYMAP[c]] = inv[S.base + KEYMAP[c]] || []).push(KEYLAB(c));   // where the rows overlap a key gets two labels
  const ch = S.arp ? ARP[arpI] : null;
  const dg = m => { if(!ch) return ''; const i = ch.iv.indexOf((m + S.transpose - ch.root + 120) % 12); return i < 0 ? '' : `<span class="dg d${'1357'[i]}">${'1357'[i]}</span>`; };
  let html = '', wi = 0;
  for(let m = lo; m <= hi; m++){
    const lab = inv[m] ? `<span class="kc">${inv[m].map(c => c === '\\' ? '&#92;' : c).join('<br>')}</span>` : '';
    const cls = (held.has(m) ? ' on' : '') + (voices.has(m) ? ' ring' : '') + (inv[m] ? ' mapped' : '');
    if(isBlack(m)){
      const bw = kw * 0.62;
      html += `<div class="k b${cls}" data-m="${m}" style="left:${(wi * kw - bw / 2).toFixed(2)}px;width:${bw.toFixed(2)}px"><span class="nn nb">${pcName(m + S.transpose)}</span>${dg(m)}${lab}</div>`;
    }else{
      // names follow the transposition (the pitch the key really sounds); C keeps its octave number and stays labelled even with names off
      const p = m + S.transpose, c = p % 12 === 0;
      html += `<div class="k w${cls}" data-m="${m}" style="left:${(wi * kw).toFixed(2)}px;width:${kw.toFixed(2)}px">${dg(m)}${lab}<span class="nn${c ? ' c' : ''}">${c ? sn(p) : pcName(p)}</span></div>`;
      wi++;
    }
  }
  kb.innerHTML = html;
  kb.classList.toggle('nolab', !S.labels);
  kb.classList.toggle('nonames', !S.keyNames);
  $('viewDown').disabled = lo - 12 < 21;
  $('viewUp').disabled = hi + 12 > 108;
}

function keyAt(e){

// harder toward the front edge of the key, like a real one
function velAt(e, k){

}
kb.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlock();
  try{ kb.setPointerCapture(e.pointerId); }catch(err){}
  const k = keyAt(e), m = k ? +k.dataset.m : null;
  ptr.set(e.pointerId, m);
  if(m != null) press(m, 'p' + e.pointerId, velAt(e, k), true);

// sliding across the keys plays each one, like a glissando
kb.addEventListener('pointermove', e => {
  if(!ptr.has(e.pointerId)) return;
  const k = keyAt(e), m = k ? +k.dataset.m : null, old = ptr.get(e.pointerId);
  if(m === old) return;
  if(old != null) lift(old, 'p' + e.pointerId);

  if(m != null) press(m, 'p' + e.pointerId, velAt(e, k), true);
});
const ptrUp = e => {

  const m = ptr.get(e.pointerId);

};

// ---------- what is sounding ----------
const PC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
// The chords the main page knows, plus every 7th-and-up chord without its 5th (C E B = Cmaj7 no5),
// which Tonal's detector does not name. Order is preference when one note set reads several ways.
const CHORDS = (() => {
  const d = [], add = (sym, iv) => d.push({sym, key:[...new Set(iv.map(x => x % 12))].sort((a, b) => a - b).join()});
  const T = [['', [0,4,7]], ['m', [0,3,7]], ['dim', [0,3,6]], ['aug', [0,4,8]], ['sus2', [0,2,7]], ['sus4', [0,5,7]],
    ['7', [0,4,7,10]], ['maj7', [0,4,7,11]], ['m7', [0,3,7,10]], ['m7b5', [0,3,6,10]], ['dim7', [0,3,6,9]],
    ['add9', [0,4,7,14]], ['m(add9)', [0,3,7,14]], ['6', [0,4,7,9]], ['m6', [0,3,7,9]],
    ['9', [0,4,7,10,14]], ['maj9', [0,4,7,11,14]], ['m9', [0,3,7,10,14]], ['m11', [0,3,7,10,14,17]], ['13', [0,4,7,10,14,21]],
    ['7sus4', [0,5,7,10]], ['m(maj7)', [0,3,7,11]], ['6/9', [0,4,7,9,14]], ['aug7', [0,4,8,10]], ['augmaj7', [0,4,8,11]],
    ['7b9', [0,4,7,10,13]], ['7#9', [0,4,7,10,15]], ['7#11', [0,4,7,10,18]], ['7b13', [0,4,7,10,20]], ['maj7#11', [0,4,7,11,18]]];
  T.forEach(([sym, iv]) => add(sym, iv));
  // (not the 6 chords: C E A without the 5th is just Am/C)
  T.forEach(([sym, iv]) => { if(iv.length >= 4 && iv.includes(7) && !sym.startsWith('6') && sym !== 'm6') add(sym + ' no5', iv.filter(x => x !== 7)); });
  return d;
})();
function chordName(ms, pc){
  const set = [...new Set(ms.map(m => m % 12))], bass = ms[0] % 12;
  let best = null;
  set.forEach(root => {
    const key = set.map(p => (p - root + 12) % 12).sort((a, b) => a - b).join();
    const i = CHORDS.findIndex(c => c.key === key);
    if(i < 0) return;
    const score = (root === bass ? 0 : 1000) + i;   // a reading with its root in the bass wins
    if(!best || score < best.score) best = {score, root, sym:CHORDS[i].sym};
  });
  if(!best) return '';
  return pc[best.root] + best.sym + (best.root !== bass ? '/' + pc[bass] : '');
}

      try{ name = (Tonal.Chord.detect(pcs)[0] || '').replace(/^([A-G][#b]?)M(?=$|\/)/, '$1'); }catch(e){}
    }
    name = name.replace(/#/g, '♯').replace(/b/g, '♭');
  }else if(ms.length === 2){
    name = L(['同度','小二度','大二度','小三度','大三度','纯四度','三全音','纯五度','小六度','大六度','小七度','大七度'],
             ['unison','minor 2nd','major 2nd','minor 3rd','major 3rd','perfect 4th','tritone','perfect 5th','minor 6th','major 6th','minor 7th','major 7th'])[(ms[1] - ms[0]) % 12];
    if(ms[1] - ms[0] >= 12 && (ms[1] - ms[0]) % 12 === 0) name = L('八度', 'octave');
  }

}

const midiHeld = new Map();   // MIDI note -> key it pressed
function onMidi(ev){
  const [st, d1, d2] = ev.data, type = st & 0xf0;
  if(type === 0x90 && d2 > 0){
    unlock();
    if(midiHeld.has(d1)) lift(midiHeld.get(d1), 'midi' + d1);
    const m = d1;
    midiHeld.set(d1, m);
    press(m, 'midi' + d1, 0.25 + 0.75 * d2 / 127);
  }else if((type === 0x80 || type === 0x90) && midiHeld.has(d1)){ lift(midiHeld.get(d1), 'midi' + d1); midiHeld.delete(d1); }
  else if(type === 0xb0 && d1 === 64){ midiPedal = d2 >= 64; pedalChanged(); }
  else if(type === 0xb0 && (d1 === 120 || d1 === 123)) allOff();
}

// ---------- drum machine & metronome ----------
// Real drum hits from the FluidR3 GM kit (CC BY 3.0), one file per General MIDI drum note.
// One clock drives both: 12 ticks per beat, so straight 16ths (every 3 ticks) and triplets (every 4) share it.
const DRUMS = {kick:36, stick:37, snare:38, hat:42, pedal:44, open:46, crash:49, ride:51, bell:53, woodHi:76, woodLo:77};
// pattern strings, one character per step: X loud, x normal, g ghost, . rest
const PATS = [
  {id:'rock',    zh:'摇滚',        en:'Rock',          div:4, kick:'X.......X.X.....', snare:'....X.......X...', hat:'X.x.X.x.X.x.X.x.'},
  {id:'pop',     zh:'流行',        en:'Pop',           div:4, kick:'X.....x.X.......', snare:'....X.......X...', hat:'x.x.x.x.x.x.x.x.'},
  {id:'funk',    zh:'放克',        en:'Funk',          div:4, kick:'X.....x...X..x..', snare:'....X..g.g..X..g', hat:'xgxgXgxgxgxgXgxg'},
  {id:'shuffle', zh:'布鲁斯 Shuffle', en:'Blues shuffle', div:3, kick:'X.....X.....', snare:'...X.....X..', hat:'X.xx.xX.xx.x'},
  {id:'swing',   zh:'爵士 Swing',   en:'Jazz swing',    div:3, ride:'X..x.gX..x.g', pedal:'...x.....x..', kick:'g..g..g..g..'},
  {id:'bossa',   zh:'波萨诺瓦',     en:'Bossa nova',    div:4, kick:'X..xX..xX..xX..x', stick:'x..x..x...x..x..', hat:'xgxgxgxgxgxgxgxg'},
];
const VEL = {X:1, x:0.7, g:0.32};
const SIGS = {'2/4':[2, 12], '3/4':[3, 12], '4/4':[4, 12], '6/8':[6, 6]};   // beats per bar, ticks per click (6/8 clicks eighth notes)
const drumBufs = {};
let drumLoad = null, drumBus = null, metroBus = null;
function loadDrums(){
  if(drumLoad) return drumLoad;
  const a = getCtx();
  drumBus = a.createGain(); metroBus = a.createGain();
  drumBus.connect(master.__out); metroBus.connect(master.__out);
  setRhythmVol();
  return drumLoad = Promise.all(Object.values(DRUMS).map(n => fetch(`/samples/drums/${n}.mp3`)
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(ab => new Promise(res => a.decodeAudioData(ab, b => { drumBufs[n] = b; res(); }, () => res())))
    .catch(() => {})));
}
function setRhythmVol(){
  if(drumBus) drumBus.gain.value = 0.55 * Math.pow(S.dvol / 70, 1.6);
  if(metroBus) metroBus.gain.value = 0.45 * Math.pow(S.mvol / 70, 1.6);
}
let openHat = null;
function hit(n, t, vel, bus){
  const b = drumBufs[n];
  if(!b) return;
  // a closed or pedalled hat chokes the open one, like a real hi-hat
  if((n === DRUMS.hat || n === DRUMS.pedal) && openHat){ try{ openHat.g.gain.setTargetAtTime(0, t, 0.02); openHat.src.stop(t + 0.2); }catch(e){} openHat = null; }
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = b; g.gain.value = vel;
  src.connect(g); g.connect(bus); src.start(t);
  if(n === DRUMS.open) openHat = {src, g};
}
const CLK = {run:false, tick:0, next:0, timer:0};
let drumsOn = false, metroOn = false;
function clockStep(){
  const a = ctx, p = PATS.find(x => x.id === S.pat) || PATS[0];
  while(CLK.next < a.currentTime + 0.12){
    const t = CLK.next, k = CLK.tick;
    if(drumsOn && k % (12 / p.div) === 0){
      const len = p[Object.keys(p).find(x => DRUMS[x] && p[x])].length;
      const step = (k / (12 / p.div)) % len;
      for(const part in DRUMS){
        const c = p[part] && p[part][step];
        if(c && VEL[c]) hit(DRUMS[part], t, VEL[c] * (part === 'kick' && p.id === 'swing' ? 0.5 : 1), drumBus);
      }
    }
    loopStep(k, t);
    const [beats, per] = SIGS[S.sig];
    if(metroOn && k % per === 0){
      const b = (k / per) % beats;
      hit(b === 0 ? DRUMS.woodHi : DRUMS.woodLo, t, b === 0 ? 1 : (S.sig === '6/8' && b === 3 ? 0.85 : 0.6), metroBus);
    }
    // light the beat dots in step with the sound
    const beatTicks = metroOn ? per : 12, nb = metroOn ? beats : 4;
    if(k % beatTicks === 0){
      const b = (k / beatTicks) % nb;
      setTimeout(() => { if(CLK.run){ showBeat(b, nb); showLoop(k); } }, Math.max(0, (t - a.currentTime) * 1000));
    }
    CLK.next += 60 / S.bpm / 12;
    CLK.tick++;
  }
  CLK.timer = setTimeout(clockStep, 25);
}
function showBeat(b, nb){
  const box = $('beats');
  if(box.children.length !== nb) box.innerHTML = '<i></i>'.repeat(nb);
  [...box.children].forEach((d, i) => { d.classList.toggle('on', i === b); d.classList.toggle('one', i === 0); });
}
function clockSync(){
  const want = drumsOn || metroOn || LP.state !== 'idle' && LP.state !== 'stop';
  $('drumBtn').setAttribute('aria-pressed', drumsOn ? 'true' : 'false');
  $('metroBtn').setAttribute('aria-pressed', metroOn ? 'true' : 'false');
  if(want && !CLK.run){
    unlock();
    loadDrums().then(() => {
      if(CLK.run || !(drumsOn || metroOn || LP.state !== 'idle' && LP.state !== 'stop')) return;
      CLK.run = true; CLK.tick = 0; CLK.next = ctx.currentTime + 0.06;
      clockStep();
    });
  }else if(!want && CLK.run){
    CLK.run = false; clearTimeout(CLK.timer); loopSilence();
    [...$('beats').children].forEach(d => d.classList.remove('on'));
  }
}

// ---------- looper ----------
// Takes ride the drum/metronome clock (12 ticks a beat), so they start on a bar line, last whole bars and follow the tempo.
// Notes are stored as positions on that grid; "snap" moves each note's start to the nearest grid line as it is recorded.
const QUANT = {'0':0, '4':12, '8':6, '16':3, '8t':4};
const LP = {state:'idle', start:null, len:0, layers:[], cur:null, open:new Map(), idx:null, sounding:new Set(), closeAt:null};
// idle → arm (waits for the next bar) → rec (first take) → play ⇄ dub (overdub); stop keeps the takes
const barTicks = () => SIGS[S.sig][0] * SIGS[S.sig][1];
const tickDur = () => 60 / S.bpm / 12;
const wrap = x => (x % LP.len + LP.len) % LP.len;
// where the clock is now, in ticks, as the player hears it (what is heard left the speakers a moment after it was scheduled)
function nowTick(){
  const a = ctx, lat = a.outputLatency || a.baseLatency || 0;
  return CLK.tick - (CLK.next - (a.currentTime - lat)) / tickDur();
}
function loopIndex(){
  const idx = new Map();
  LP.layers.concat(LP.cur ? [LP.cur] : []).forEach(L => L.notes.forEach(n => {
    if(n.dur == null || n.pos == null) return;
    const k = Math.floor(n.pos);
    if(!idx.has(k)) idx.set(k, []);
    idx.get(k).push(n);
  }));
  LP.idx = idx;
}
function recOn(m, vel){
  if(LP.state !== 'rec' && LP.state !== 'dub' || !CLK.run) return;
  recOff(m, false);
  let at = nowTick();
  if(at < LP.start) at = LP.start;   // a note a hair before the first bar line belongs on it
  const q = QUANT[S.quant];
  if(q) at = Math.round(at / q) * q;
  const n = {m:m + S.transpose, vel, inst:inst.id, abs:at, pos:null, dur:null, fade:false, t0:nowTick()};
  if(LP.len) n.pos = wrap(at - LP.start);
  LP.cur.notes.push(n);
  LP.open.set(m, n);
}
function recOff(m, pedal){
  const n = LP.open.get(m);
  if(!n) return;
  LP.open.delete(m);
  n.dur = Math.max(1, nowTick() - n.t0);   // the note keeps the length it was played with, only its start moves
  n.fade = pedal;
  if(n.pos != null) loopIndex();
}
// the first take has an open end: close it on whole bars, rounding to the nearest bar line
function closeFirst(at){
  const bt = barTicks();
  LP.len = Math.max(1, Math.round((at - LP.start) / bt)) * bt;
  LP.closeAt = LP.start + LP.len;
  LP.cur.notes.forEach(n => { n.pos = wrap(n.abs - LP.start); });
}
function finishTake(next){
  if(LP.cur && LP.cur.notes.length) LP.layers.push(LP.cur);
  LP.cur = next === 'dub' ? {notes:[]} : null;
  LP.state = LP.layers.length || next === 'dub' ? next : 'idle';
  LP.closeAt = null;
  loopIndex(); loopUI();
}
function recPress(){
  unlock();
  const st = LP.state;
  if(st === 'idle'){
    LP.layers = []; LP.len = S.bars * barTicks(); LP.cur = {notes:[]}; LP.state = 'arm';
    // with nothing keeping time yet, the metronome counts in a bar first
    if(!CLK.run){ if(!drumsOn) metroOn = true; LP.start = null; clockSync(); }
    else armAt(nowTick());
  }else if(st === 'arm'){ LP.state = 'idle'; LP.cur = null; clockSync(); }
  else if(st === 'rec'){
    const at = nowTick();
    if(!S.bars && LP.closeAt == null) closeFirst(at);
    if(at >= LP.closeAt - 1) finishTake('play');
    // otherwise it plays on to the bar line and closes there by itself
  }
  else if(st === 'play') { LP.cur = {notes:[]}; LP.state = 'dub'; }
  else if(st === 'dub') finishTake('play');
  else if(st === 'stop'){ LP.cur = {notes:[]}; LP.state = 'dub'; startLoop(); }
  loopUI();
}
// a take starts on the next bar line, or on this one when the press was only a little late
function armAt(t){
  const bt = barTicks(), b = Math.floor(t / bt) * bt;
  LP.start = t - b < 3 ? b : b + bt;
  if(LP.len) LP.closeAt = LP.start + LP.len;
}
function loopStep(k, t){
  if(LP.state === 'arm'){
    if(LP.start == null){ const bt = barTicks(); LP.start = Math.ceil((k + 1) / bt) * bt; if(LP.len) LP.closeAt = LP.start + LP.len; }
    if(k >= LP.start){ LP.state = 'rec'; setTimeout(loopUI, Math.max(0, (t - ctx.currentTime) * 1000)); }
  }
  if(LP.state === 'rec' && LP.closeAt != null && k >= LP.closeAt){
    setTimeout(() => { if(LP.state === 'rec') finishTake('play'); }, Math.max(0, (t - ctx.currentTime) * 1000));
  }
  if(!LP.len || !LP.idx || (LP.state !== 'play' && LP.state !== 'dub' && !(LP.state === 'rec' && LP.closeAt != null && k >= LP.closeAt)) || k < LP.start) return;
  const list = LP.idx.get(wrap(k - LP.start));
  if(!list) return;
  const td = tickDur(), g = Math.pow(S.lvol / 80, 1.6);
  for(const n of list){
    const abs = k + (n.pos - Math.floor(n.pos));
    if(abs <= n.abs + 0.5) continue;   // the pass it was played in: it was heard live already
    const i = INSTRUMENTS.find(x => x.id === n.inst) || inst;
    if(i.notes) loadInst(i);
    const when = t + (n.pos - Math.floor(n.pos)) * td;
    const v = voice(n.m, n.vel, when, i, g);
    if(!v) continue;
    const off = when + n.dur * td;
    if(n.fade) fade(v, off); else release(v, v.rel, off);
    LP.sounding.add(v);
    v.srcs[0].onended = () => { LP.sounding.delete(v); try{ v.g.disconnect(); }catch(e){} };
  }
}
function loopSilence(){ LP.sounding.forEach(v => { v.done = false; v.fade = null; release(v, 0.05); }); LP.sounding.clear(); }
function startLoop(){
  if(CLK.run){ const bt = barTicks(), t = nowTick(); LP.start = Math.ceil(t / bt) * bt; }
  else LP.start = 0;
  LP.layers.forEach(L => L.notes.forEach(n => { n.abs = -1e9; }));   // the clock may have restarted: every note plays from the first pass
  clockSync();
}
function showLoop(k){
  if(LP.state === 'idle' || LP.state === 'stop') return;
  const bt = barTicks();
  let s;
  if(LP.state === 'arm') s = L('下一小节开始录…', 'Recording from the next bar…');
  else if(k < LP.start) s = '';
  else{
    const bar = Math.floor((k - LP.start) % (LP.len || 1e9) / bt) + 1, tot = LP.len ? LP.len / bt : '?';
    const n = LP.layers.length;
    s = LP.state === 'rec' ? L(`● 录音 第 ${bar}/${tot} 小节`, `● Recording bar ${bar}/${tot}`)
      : LP.state === 'dub' ? L(`● 叠录 第 ${bar}/${tot} 小节 · ${n} 层`, `● Overdub bar ${bar}/${tot} · ${n} layer${n === 1 ? '' : 's'}`)
      : L(`▶ 循环 第 ${bar}/${tot} 小节 · ${n} 层`, `▶ Looping bar ${bar}/${tot} · ${n} layer${n === 1 ? '' : 's'}`);
  }
  $('loopNote').textContent = s;
}
function loopUI(){
  const st = LP.state, b = $('recBtn');
  b.setAttribute('aria-pressed', st === 'rec' || st === 'dub' ? 'true' : 'false');
  b.classList.toggle('arm', st === 'arm');
  $('recLab').textContent = st === 'play' || st === 'stop' ? L('叠录', 'Overdub') : st === 'rec' ? L('录音中', 'Recording') : st === 'dub' ? L('叠录中', 'Overdubbing') : L('循环录音', 'Loop rec');
  $('loopPlay').textContent = st === 'stop' ? L('▶ 播放', '▶ Play') : L('■ 停止', '■ Stop');
  $('loopPlay').disabled = !(LP.layers.length && st !== 'arm' && st !== 'rec');
  $('loopUndo').disabled = !LP.layers.length && st !== 'dub';
  $('loopClear').disabled = st === 'idle';
  $('barsSel').disabled = st !== 'idle';
  if(st === 'idle') $('loopNote').textContent = '';
  else if(CLK.run) showLoop(Math.floor(nowTick()));
  if(st === 'stop') $('loopNote').textContent = L(`已停 · ${LP.layers.length} 层`, `Stopped · ${LP.layers.length} layer${LP.layers.length === 1 ? '' : 's'}`);
}
$('recBtn').onclick = recPress;
$('loopPlay').onclick = () => {
  if(LP.state === 'stop'){ LP.state = 'play'; startLoop(); }
  else if(LP.state === 'play' || LP.state === 'dub'){ if(LP.state === 'dub') finishTake('play'); LP.state = 'stop'; loopSilence(); clockSync(); }
  loopUI();
};
$('loopUndo').onclick = () => {
  if(LP.state === 'dub'){ LP.cur = {notes:[]}; LP.open.clear(); }   // drop what this pass recorded, keep overdubbing
  else LP.layers.pop();
  if(!LP.layers.length && LP.state !== 'dub'){ LP.state = 'idle'; LP.len = 0; loopSilence(); clockSync(); }
  loopIndex(); loopUI();
};
$('loopClear').onclick = () => {
  Object.assign(LP, {state:'idle', start:null, len:0, layers:[], cur:null, idx:null, closeAt:null}); LP.open.clear();
  loopSilence(); clockSync(); loopUI();
};
[[0, '自动', 'Auto'], [1, '1 小节', '1 bar'], [2, '2 小节', '2 bars'], [4, '4 小节', '4 bars'], [8, '8 小节', '8 bars']].forEach(([v]) => {
  const o = document.createElement('option'); o.value = v; $('barsSel').appendChild(o);
});
$('barsSel').value = S.bars;
$('barsSel').onchange = e => { S.bars = +e.target.value; save(); e.target.blur(); };
[['0'], ['4'], ['8'], ['16'], ['8t']].forEach(([v]) => { const o = document.createElement('option'); o.value = v; $('quantSel').appendChild(o); });
$('quantSel').value = S.quant;
$('quantSel').onchange = e => { S.quant = e.target.value; save(); e.target.blur(); };
$('lvol').value = S.lvol;
$('lvol').oninput = e => { S.lvol = +e.target.value; save(); };
$('lvol').onchange = e => e.target.blur();

function applyLang(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.title = L('弹钢琴 · Chordle', 'Free play · Chordle');
  document.querySelectorAll('[data-t]').forEach(el => { const v = T[el.dataset.t]; if(v) el.textContent = v[LANG === 'en' ? 1 : 0]; });
  $('langBtn').textContent = LANG === 'en' ? '中文' : 'EN';
  [...$('instSel').options].forEach(o => { const i = INSTRUMENTS.find(x => x.id === o.value); o.textContent = L(i.name, i.en); });
  [...$('patSel').options].forEach(o => { const p = PATS.find(x => x.id === o.value); o.textContent = L(p.zh, p.en); });
  const BARS = {0:['自动（按整小节收尾）', 'Auto (rounds to bars)'], 1:['1 小节', '1 bar'], 2:['2 小节', '2 bars'], 4:['4 小节', '4 bars'], 8:['8 小节', '8 bars']};
  [...$('barsSel').options].forEach(o => { o.textContent = L(...BARS[o.value]); });
  const QN = {'0':['关', 'Off'], '4':['四分音符', '1/4'], '8':['八分音符', '1/8'], '16':['十六分音符', '1/16'], '8t':['八分三连音', '1/8 triplet']};
  [...$('quantSel').options].forEach(o => { o.textContent = L(...QN[o.value]); });
  loopUI();
  pedalChanged(); showNow(); showSus(); showArp();
  if(midiAccess) hookMidi();
}
$('langBtn').onclick = () => { LANG = LANG === 'en' ? 'zh' : 'en'; try{ localStorage.setItem('chordle:lang', LANG); }catch(e){} applyLang(); };
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, unlock, {capture:true, once:true}));

applyLang();
showKey(); fitView(true); setArp(0); showRange();
$('chordName').textContent = '';
$('noteNames').textContent = L('随便按一个键开始', 'Press any key to start');
// decode the samples right away so the first note plays without a wait
setInst(S.inst);
})();
